  <line x1="80" y1="35" x2="80" y2="80" stroke-width="1"/>
  <line x1="77" y1="75" x2="80" y2="80" stroke-width="1"/>
  <line x1="83" y1="75" x2="80" y2="80" stroke-width="1"/>
  <rect x="60" y="80" width="40" height="30" fill="none"/>
  <text x="80" y="95" dominant-baseline="middle" text-anchor="middle">C</text>
  <line x1="80" y1="110" x2="80" y2="155" stroke-width="1"/>
  <line x1="80" y1="155" x2="100" y2="155" stroke-width="1"/>
  <line x1="95" y1="152" x2="100" y2="155" stroke-width="1"/>
  <line x1="95" y1="158" x2="100" y2="155" stroke-width="1"/>
  <line x1="140" y1="35" x2="160" y2="35" stroke-width="1"/>
  <line x1="160" y1="35" x2="160" y2="80" stroke-width="1"/>
  <line x1="157" y1="75" x2="160" y2="80" stroke-width="1"/>
  <line x1="163" y1="75" x2="160" y2="80" stroke-width="1"/>
  <rect x="140" y="80" width="40" height="30" fill="none"/>
  <text x="160" y="95" dominant-baseline="middle" text-anchor="middle">D</text>
  <rect x="100" y="140" width="40" height="30" fill="none"/>
  <text x="120" y="155" dominant-baseline="middle" text-anchor="middle">E</text>
  <line x1="160" y1="110" x2="160" y2="155" stroke-width="1"/>
  <line x1="160" y1="155" x2="140" y2="155" stroke-width="1"/>
  <line x1="145" y1="152" x2="140" y2="155" stroke-width="1"/>
