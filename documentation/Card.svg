  <rect x="190" y="130" width="300" height="240" stroke-width="1" class="closeToBackground"/>
  <text x="200" y="140" dominant-baseline="hanging">FPGA chip (XCU50)</text>
  <line x1="170" y1="250" x2="210" y2="250" stroke-width="1"/>
  <line x1="210" y1="250" x2="210" y2="190" stroke-width="1"/>
  <line x1="210" y1="190" x2="230" y2="190" stroke-width="1"/>
  <line x1="230" y1="190" x2="225" y2="187" stroke-width="1"/>
  <line x1="230" y1="190" x2="225" y2="193" stroke-width="1"/>
  <rect x="230" y="160" width="240" height="60" stroke-width="1" fill="none"/>
