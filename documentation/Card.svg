<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <style>
    :root { --foreground: #000000; --background: #ffffff; --closeToBackground: #e0e0e0 }
    @media (prefers-color-scheme: dark) { :root { --foreground: #ffffff; --background: #000000; --closeToBackground: #404040 } }
    line, rect { stroke: var(--foreground) }
    text { fill: var(--foreground) }
    .background { fill: var(--background) }
    .closeToBackground { fill: var(--closeToBackground) }
  </style>
  <line x1="30" y1="430" x2="30" y2="30" stroke-width="1"/>
  <line x1="30" y1="30" x2="5" y2="30" stroke-width="1"/>
  <rect x="30" y="100" width="500" height="300" stroke-width="1" fill="none"/>
  <rect x="80" y="400" width="200" height="30" stroke-width="1" fill="none"/>
  <line x1="100" y1="400" x2="100" y2="430" stroke-width="1"/>
  <line x1="120" y1="400" x2="120" y2="430" stroke-width="1"/>
  <line x1="140" y1="400" x2="140" y2="430" stroke-width="1"/>
  <line x1="160" y1="400" x2="160" y2="430" stroke-width="1"/>
  <line x1="180" y1="400" x2="180" y2="430" stroke-width="1"/>
  <line x1="200" y1="400" x2="200" y2="430" stroke-width="1"/>
  <line x1="220" y1="400" x2="220" y2="430" stroke-width="1"/>
