  <line x1="310" y1="220" x2="310" y2="240" stroke-width="1"/>
  <line x1="310" y1="240" x2="307" y2="235" stroke-width="1"/>
  <line x1="310" y1="240" x2="313" y2="235" stroke-width="1"/>
  <line x1="310" y1="270" x2="310" y2="290" stroke-width="1"/>
  <line x1="310" y1="290" x2="307" y2="285" stroke-width="1"/>
  <line x1="310" y1="290" x2="313" y2="285" stroke-width="1"/>
  <rect x="240" y="240" width="140" height="30" stroke-width="1" fill="none"/>
  <text x="250" y="245" dominant-baseline="hanging" font-size="10">Header</text>
  <text x="250" y="255" dominant-baseline="hanging" font-size="10">Queue</text>
  <line x1="430" y1="220" x2="430" y2="240" stroke-width="1"/>
  <line x1="430" y1="240" x2="427" y2="235" stroke-width="1"/>
  <line x1="430" y1="240" x2="433" y2="235" stroke-width="1"/>
  <line x1="430" y1="270" x2="430" y2="290" stroke-width="1"/>
  <line x1="430" y1="290" x2="427" y2="285" stroke-width="1"/>
  <line x1="430" y1="290" x2="433" y2="285" stroke-width="1"/>
  <rect x="400" y="240" width="60" height="30" stroke-width="1" fill="none"/>
  <text x="410" y="245" dominant-baseline="hanging" font-size="10">Body</text>
  <text x="410" y="255" dominant-baseline="hanging" font-size="10">Queue</text>
  <rect x="230" y="290" width="240" height="60" stroke-width="1" fill="none"/>
  <text x="240" y="300" dominant-baseline="hanging">Sender transform</text>
  <line x1="170" y1="260" x2="175" y2="257" stroke-width="1"/>
  <line x1="170" y1="260" x2="175" y2="263" stroke-width="1"/>
  <line x1="170" y1="260" x2="210" y2="260" stroke-width="1"/>
  <line x1="210" y1="260" x2="210" y2="320" stroke-width="1"/>
